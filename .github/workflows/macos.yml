name: macOS build & smoke test

# Live verification on a real macOS runner (Apple Silicon): proves the code
# imports, picks the macOS backend, builds a .app, and that the platform layer
# degrades gracefully with no Claude Code / credentials present.
#
# NOTE: CI cannot test the Keychain service name, the floating window, the
# `claude auth login` flow, or login autostart — those need a real interactive
# Mac with Claude Code installed (see MACOS.md "Cần kiểm chứng").

on:
  push:
    branches: [ macos-port ]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14            # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python / tkinter
        run: |
          python3 --version
          python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Install dependencies
        run: python3 -m pip install --upgrade -r requirements.txt

      - name: Smoke test (backend / credential store / plist)
        run: python3 ci/smoke_macos.py

      - name: Build TokenUsageBar.app
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Verify the bundle exists
        run: |
          test -d "dist/TokenUsageBar.app" || { echo "::error::.app not built"; exit 1; }
          echo "app built OK"
          ls -la dist

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenUsageBar-macos
          path: dist/TokenUsageBar.app
          if-no-files-found: error
